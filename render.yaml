services:
  # MySQL Database
  - type: pserv
    name: taskmgr-db
    runtime: mysql
    plan: starter
    ipAllowList: []
    region: oregon
    mysqlVersion: "8.0"
    databaseName: task_db
    user: postgres

  # Backend Service
  - type: web
    name: taskmgr-api
    runtime: jvm
    plan: standard
    region: oregon
    buildCommand: "cd backend && mvn clean package -DskipTests"
    startCommand: "cd backend && java -jar target/taskmgr-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromService:
          type: pserv
          service: taskmgr-db
          property: connectionString
        value: jdbc:mysql://${{SPRING_DATASOURCE_HOST}}:3306/task_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        fromService:
          type: pserv
          service: taskmgr-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          type: pserv
          service: taskmgr-db
          property: password
      - key: JWT_SECRET
        value: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: ${{FRONTEND_URL}}
    routes:
      - path: /api/*
        destination: http://localhost:8080
    healthCheckPath: /actuator/health
    autoDeploy: true
    depends_on:
      - type: pserv
        service: taskmgr-db

  # Frontend Service (Static Site)
  - type: web
    name: taskmgr-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    autoDeploy: true
    depends_on:
      - name: taskmgr-api
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          service: taskmgr-api
          property: url
        value: ${{API_URL}}/api
